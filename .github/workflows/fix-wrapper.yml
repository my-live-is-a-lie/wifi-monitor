name: Fix Wrapper Jar
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: \'temurin\'
          java-version: \'17\'

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate missing wrapper jar
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            gradle wrapper
          else
            gradle wrapper --gradle-version 8.7
          fi
          ls -lh gradle/wrapper/

      - name: Commit jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat .gitignore
          git diff --staged --quiet || git commit -m "fix: add missing gradle-wrapper.jar"
          git push