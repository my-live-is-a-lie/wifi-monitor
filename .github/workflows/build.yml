name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Inspect generated APKs
        run: |
          echo "=== Finding all APKs ==="
          find . -name "*.apk" -ls
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
          ls -la apk_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Monitor-APK
          path: apk_output/*.apk

      - name: Create GitHub Release with APK
        run: |
          APK_FILE=$(find apk_output -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            gh release delete v1.0.0 --yes || true
            git push origin :refs/tags/v1.0.0 || true
            gh release create v1.0.0 "$APK_FILE" \
              --title "WiFi Monitor v1.0.0" \
              --notes "Direct APK download for WiFi Monitor."
          else
            echo "No APK found to release!"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
