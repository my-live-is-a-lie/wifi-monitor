name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || true

      - name: Expose Errors
        run: |
          python3 -c "
          with open('build.log') as f:
              lines = f.readlines()
          errors = [line for line in lines if any(k in line.lower() for k in ['error', 'unresolved', 'failed', 'cannot', 'e: '])]
          print('Found errors count:', len(errors))
          for e in errors[:50]:
              print('::warning title=BuildError::' + e.strip().replace('\n', ' '))
          "
          exit 1
