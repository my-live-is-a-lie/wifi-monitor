name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || echo "no wrapper yet"
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug --parallel --max-workers=2 --no-daemon; else gradle assembleDebug --parallel --max-workers=2 --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk