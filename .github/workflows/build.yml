name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        id: build_step
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Post failure log if failed
        if: failure()
        run: |
          tail -n 120 build_output.log > log_summary.txt || echo "No log" > log_summary.txt
          gh api -X POST /repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$(cat log_summary.txt)" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        if: success()
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "WiFi Monitor v1.0.0" \
            --notes "Direct APK download for WiFi Monitor."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
