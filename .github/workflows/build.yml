name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true

      - name: Report Build Result
        if: always()
        run: |
          echo "=== PWD AND BUILD DIRS ==="
          find . -maxdepth 3 -not -path '*/.*'
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log > summary.txt
          gh issue create --title "Build Log for $(git rev-parse --short HEAD)" --body-file summary.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if no APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            exit 1
          fi
