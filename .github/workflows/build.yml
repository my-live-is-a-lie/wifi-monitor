name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || true

      - name: Check files and errors
        run: |
          echo "=== Error lines from build.log ==="
          grep -i -E "error|exception|failed" build.log | head -n 40
          echo "=== Find all files under app/build ==="
          find app/build -type f 2>/dev/null || echo "No app/build"
          echo "=== Find all .apk files ==="
          find . -name "*.apk"
          exit 1
